name: Build NEXTY MINE Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Configure AdMob application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-7822338306225083~4092687938" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in source:
              source, count = re.subn(r'(<application\\b[^>]*>)', r'\\1\\n        ' + meta, source, count=1)
              if count != 1:
                  raise SystemExit("Could not insert AdMob App ID into AndroidManifest.xml")
              manifest.write_text(source)
          PY

      - name: Generate Android app icons
        run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath resources

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | sed '/-----BEGIN CERTIFICATE-----/d; /-----END CERTIFICATE-----/d' | tr -d '[:space:]' | base64 --decode > android/app/nexty-mine-release.jks
          test -s android/app/nexty-mine-release.jks

      - name: Build release APK
        working-directory: android-wrapper/android
        run: ./gradlew assembleRelease

      - name: Sign and verify release APK
        working-directory: android-wrapper/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          "$APKSIGNER" sign \
            --ks app/nexty-mine-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexty-mine-release-apk
          path: android-wrapper/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
